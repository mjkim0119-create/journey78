  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title">

<script>
const PARAMS = Object.fromEntries(new URLSearchParams(location.search));
let me = null, mine = {}, curSt = null, openedFromLink = false;
// 기기 표시: 이 기기에서 처음 만든 짧은 무작위 값. 교사용 화면에서 친구 번호로 들어간 경우를 찾는 데 쓴다
function devId(){ try{ let d=localStorage.getItem('u78-dev'); if(!d){ d=Math.random().toString(36).slice(2,8); localStorage.setItem('u78-dev',d); } return d; }catch(e){ return ''; } }
function loadMe(){ try{ me = JSON.parse(localStorage.getItem('u78-me')||'null'); }catch(e){ me=null; } }
function saveMe(){ try{ localStorage.setItem('u78-me', JSON.stringify(me)); }catch(e){} }
loadMe();
// 교사 시험용: 2-3반 40번 김민주는 날짜와 상관없이 모든 역이 열린다
function isTester(){ return !!me && me.cls==='2-3' && String(me.no)==='40' && me.name==='김민주'; }
const _isOpen=isOpen; isOpen=function(c,st){ return isTester()||_isOpen(c,st); };

// ---------- 처음 화면 ----------
const gCls = document.getElementById('g-cls');
CLASSES.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c+'반'; gCls.appendChild(o); });
document.getElementById('g-go').onclick = ()=>{
  const no = document.getElementById('g-no').value.trim(), name = document.getElementById('g-name').value.trim();
  if(!no||!name){ toast('번호와 이름을 적어 주세요'); return; }
  if(!/^\d{1,2}$/.test(no)||+no<1||+no>40){ toast('번호는 출석번호만 적어요 (예: 7)'); return; }
  me = {cls:gCls.value, no, name}; saveMe(); start();
};
document.getElementById('change').onclick = ()=>{ document.getElementById('main').hidden=true; document.getElementById('gate').hidden=false;
  if(me){ gCls.value=me.cls; document.getElementById('g-no').value=me.no; document.getElementById('g-name').value=me.name; } };

// ---------- 지도 ----------
const road=document.getElementById('road'), prog=document.getElementById('prog'), trav=document.getElementById('trav');
const RL=road.getTotalLength(); prog.style.strokeDasharray=RL+' '+RL; prog.style.strokeDashoffset=RL;
const STOPLEN={};
document.querySelectorAll('.st').forEach(g=>{ const c=g.querySelector('.spot'); const cx=+c.getAttribute('cx'), cy=+c.getAttribute('cy');
  let best=0,bd=1e9; for(let L=0;L<=RL;L+=4){ const p=road.getPointAtLength(L); const dd=(p.x-cx)**2+(p.y-cy)**2; if(dd<bd){bd=dd;best=L;} } STOPLEN[g.dataset.id]=best; });
let curLen=0, anim=null;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function placeTrav(L){ const p=road.getPointAtLength(L); trav.setAttribute('transform','translate('+p.x+','+(p.y-18)+')'); prog.style.strokeDashoffset=RL-L; }
function travelTo(L){ trav.style.display=L>0?'':'none'; if(anim)cancelAnimationFrame(anim);
  const from=curLen,to=L,dur=reduce?0:Math.min(2600,400+Math.abs(to-from)*0.9),t0=performance.now();
  const step=now=>{ const k=dur?Math.min(1,(now-t0)/dur):1; const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2; curLen=from+(to-from)*e; placeTrav(curLen); if(k<1)anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step); }
function mapId(st){ return st.startsWith('n')?'new':st; }
// 도장은 도장 질문(stamp 부분)에 답하면 찍힌다. parts가 없는 역은 모든 질문
function stampIdx(q){ const sp=(q.parts||[]).filter(p=>p.stamp).map(p=>p.key); return q.prompts.map((p,i)=>i).filter(i=>!sp.length||sp.includes(q.prompts[i].part)); }
function answered(st){ const q=QUESTIONS[st]; const m=mine[st]||{}; return !!q && stampIdx(q).every(i=>(m[i]||'').trim()); }

function render(pop){
  const c = me.cls;
  // 지금 위치: 오늘까지 도착한 역 가운데 가장 늦은 역
  let best=null; ORDER.forEach(st=>{ if(isOpen(c,st)) best=st; });
  document.querySelectorAll('.st').forEach(g=>{
    const id=g.dataset.id; g.classList.remove('pop');
    if(id==='new'){
      ['n1','n2','n3'].forEach((st,i)=>{ const s=g.querySelector('.stamp[data-sub="'+i+'"]'); s.classList.toggle('on',answered(st)); s.classList.toggle('pop',pop===st);
        g.querySelectorAll('.t-spot')[i].style.display=answered(st)?'none':''; });
      g.classList.toggle('lock', !['n1','n2','n3'].some(st=>isOpen(c,st)));
    } else if(id==='goal'){ g.classList.add('lock'); }
    else { g.classList.toggle('done', answered(id)); g.classList.toggle('lock', !isOpen(c,id)); if(pop===id) g.classList.add('pop'); }
  });
  const msg=document.getElementById('msg');
  if(!best){ msg.innerHTML='첫 수업 날 출발해요'; travelTo(0); }
  else { const q=QUESTIONS[best]; msg.innerHTML='지금 위치: <b>'+esc(q.name)+'</b> ('+firstDate(c,best)+')'+(answered(best)?' 도장 완료':' 도장 받을 차례'); travelTo(STOPLEN[mapId(best)]); }
  try{ const f=JSON.parse(localStorage.getItem('u78-forms')||'{}'); document.querySelectorAll('.form').forEach(x=>x.classList.toggle('on',!!f['f'+x.dataset.f])); document.querySelectorAll('.blk').forEach(x=>x.classList.toggle('on',!!f['b'+x.dataset.b])); }catch(e){}
}

document.querySelectorAll('.form,.blk').forEach(x=>x.addEventListener('click',()=>{ try{ const f=JSON.parse(localStorage.getItem('u78-forms')||'{}'); const k=x.classList.contains('form')?'f'+x.dataset.f:'b'+x.dataset.b; f[k]=f[k]?0:1; localStorage.setItem('u78-forms',JSON.stringify(f)); }catch(e){} render(); }));

document.querySelectorAll('.st').forEach(g=>{
  const act=()=>{ const id=g.dataset.id; if(id==='goal'){ toast('12/30 동화울축제에서 만나요'); return; }
    if(id==='new'){ const open=['n1','n2','n3'].filter(st=>isOpen(me.cls,st)); if(!open.length){ toast('아직 도착하지 않은 역이에요'); return; }
      const next=open.find(st=>!answered(st))||open[open.length-1]; openSheet(next); return; }
    if(!isOpen(me.cls,id)){ toast('아직 도착하지 않은 역이에요 ('+(firstDate(me.cls,id)||'')+')'); return; }
    openSheet(id); };
  g.addEventListener('click',act); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
});

// ---------- 질문 창 ----------
const dim=document.getElementById('dim');
function openSheet(st){
  curSt=st; const q=QUESTIONS[st], m=mine[st]||{};
  document.getElementById('s-title').textContent=q.name;
  document.getElementById('s-sub').textContent=q.unit+(firstDate(me.cls,st)?', '+firstDate(me.cls,st):'');
  const rc=document.getElementById('s-recall'); rc.innerHTML='';
  if(q.recall){ const items=q.recall.map(r=>{ const rq=QUESTIONS[r], rm=mine[r]||{}; const a=stampIdx(rq).map(i=>rm[i]).filter(Boolean).join('\n'); return '<div><b>'+esc(rq.name)+'</b><div class="a">'+(a?esc(a):'<span style="color:var(--muted)">아직 쓰지 않았어요</span>')+'</div></div>'; }).join('');
    rc.innerHTML='<div class="recall"><div style="color:var(--muted)">지난 역에서 내가 쓴 답</div>'+items+'</div>'; }
  const parts=q.parts||[{key:'_',name:'',stamp:true}];
  const box=(p,i)=>'<label style="display:grid;gap:6px"><span class="q'+(p.key?' key':'')+'">'+esc(p.q)+'<span class="lang '+p.lang+'">'+LANG[p.lang]+'</span></span>'+(p.frame?'<span class="frame">'+esc(p.frame)+'</span>':'')+'<textarea data-i="'+i+'" maxlength="1000">'+esc(m[i]||'')+'</textarea></label>';
  document.getElementById('s-qs').innerHTML=parts.map(pt=>{
    const idx=q.prompts.map((p,i)=>i).filter(i=>(q.prompts[i].part||'_')===pt.key);
    const done=idx.every(i=>(m[i]||'').trim());
    if(pt.view==='columns') return '<section class="part" data-part="'+pt.key+'">'+'<h3>'+esc(pt.name)+'</h3><div class="left" style="color:var(--muted);font-size:14px">영상이 멈출 때마다 하나씩 써서 보내요</div>'+idx.map(i=>'<div class="one" style="display:grid;gap:8px">'+box(q.prompts[i],i)+'<div class="acts"><button class="btn ghost send" data-part="'+pt.key+'" data-one="'+i+'">'+((m[i]||'').trim()?'고쳐서 다시 보내기':'보내기')+'</button></div></div>').join('')+'</section>';
    return '<section class="part'+(pt.stamp?' stamp-part':'')+'" data-part="'+pt.key+'">'+(pt.name?'<h3>'+esc(pt.name)+(done?' <span class="ok">보냄</span>':'')+'</h3>':'')+idx.map(i=>box(q.prompts[i],i)).join('')+
      '<div class="acts"><button class="btn'+(pt.stamp?'':' ghost')+' send" data-part="'+pt.key+'">'+(pt.stamp?'제출하고 도장 받기':(done?'고쳐서 다시 보내기':'보내기'))+'</button></div></section>';
  }).join('');
  dim.querySelectorAll('.send').forEach(b=>b.onclick=()=>sendPart(b));
  dim.hidden=false; const first=[...dim.querySelectorAll('textarea')].find(t=>!t.value.trim()); setTimeout(()=>{ if(first) first.focus(); },50);
}
document.getElementById('s-close').onclick=()=>{ dim.hidden=true; };
dim.addEventListener('click',e=>{ if(e.target===dim) dim.hidden=true; });
async function sendPart(b){
  const q=QUESTIONS[curSt]; const sec=b.closest('.part'); const pt=(q.parts||[]).find(p=>p.key===b.dataset.part)||{stamp:true};
  const tas=b.dataset.one!=null?[sec.querySelector('textarea[data-i="'+b.dataset.one+'"]')]:[...sec.querySelectorAll('textarea')];
  const answers=tas.map(t=>({i:+t.dataset.i, q:q.prompts[+t.dataset.i].q, a:t.value.trim(), key:!!q.prompts[+t.dataset.i].key}));
  if(answers.some(a=>!a.a)){ toast('이 부분의 모든 칸에 답을 써 주세요'); return; }
  const label=b.textContent; b.disabled=true; b.textContent='보내는 중';
  const payload={cls:me.cls,no:me.no,name:me.name,st:curSt,stName:q.name,answers,dev:devId()};
  // 한꺼번에 몰려서 실패하면 잠깐 기다렸다가 한 번 더 보낸다
  try{ try{ mine=await call('submit',payload); }catch(e1){ b.textContent='다시 보내는 중'; await new Promise(r=>setTimeout(r,1500+Math.random()*2500)); mine=await call('submit',payload); }
    if(pt.stamp){ dim.hidden=true; render(curSt); toast('도장 쾅! 이제 앞 화면을 봐 주세요'); }
    else { toast('보냈어요. 앞 화면을 봐 주세요'); openSheet(curSt); render(); } }
  catch(e){ toast('보내지 못했어요. 잠시 뒤 다시 눌러 주세요'); b.disabled=false; b.textContent=label; }
}

async function start(){
  document.getElementById('gate').hidden=true; document.getElementById('main').hidden=false;
  document.getElementById('me').textContent=me.cls+'반 '+me.no+'번 '+me.name;
  // 지도 오른쪽 위 반, 번호, 이름 칸을 처음 입력한 정보로 채운다
  const ff=document.querySelectorAll('.t-field'); if(ff.length>=2){ ff[0].textContent='2학년 '+String(me.cls).split('-').pop()+'반 '+me.no+'번'; ff[1].textContent='이름 '+me.name; }
  render();
  try{ mine=await call('getMine',me.cls,me.no); render(); }catch(e){ document.getElementById('msg').textContent='기록을 불러오지 못했어요. 새로고침해 주세요'; }
  // QR이나 링크에 ?st=s71 처럼 역이 붙어 있으면 지도에서 그 도장 칸을 깜빡여 누르게 한다
  if(PARAMS.st && QUESTIONS[PARAMS.st] && !openedFromLink){ openedFromLink=true; const g=document.querySelector('.st[data-id="'+mapId(PARAMS.st)+'"]');
    if(isOpen(me.cls,PARAMS.st)){ if(g && !answered(PARAMS.st)){ g.classList.add('call'); g.addEventListener('click',()=>g.classList.remove('call'),{once:true}); } toast(QUESTIONS[PARAMS.st].name+' 도장 칸을 눌러 보세요'); }
    else toast('아직 도착하지 않은 역이에요 ('+(firstDate(me.cls,PARAMS.st)||'')+')'); }
}
document.getElementById('boot').style.display='none';
if(me) start(); else document.getElementById('gate').hidden=false;
</script>
</body></html>
